# Single job: build and push happen together, so the pipeline has no
# dependency on the runner's podman store persisting between jobs.
#
# Published tags: latest, <fedora version>, <commit sha>.
# Fedora version is read from BASE_IMAGE_TAG in the Containerfile.

stages:
  - build

variables:
  IMAGE_NAME: custom-silverblue

# Without this, pushes to branches with no matching job create empty pipelines.
workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # TEMPORARY: lets this branch be validated before merging. Remove before merge.
    - if: '$CI_COMMIT_BRANCH =~ /^ci\//'

image-build:
  stage: build
  tags:
    - tubs-kns
  interruptible: true
  # Serialises overlapping publishes (schedule vs. push) instead of racing.
  resource_group: registry
  timeout: 1h
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    # TEMPORARY: lets this branch be validated before merging. Remove before merge.
    - if: '$CI_COMMIT_BRANCH =~ /^ci\//'
  script:
    - |
      set -euo pipefail
      echo "Pipeline source ${CI_PIPELINE_SOURCE}"

      # Fail early and clearly if the container registry is unavailable,
      # rather than at push time.
      if [ -z "${CI_REGISTRY:-}" ]; then
        echo "::error::Container registry is not enabled on this project or instance"
        exit 1
      fi

      FEDORA_VERSION="$(sed -n 's/^ARG BASE_IMAGE_TAG="\([0-9]*\)"/\1/p' Containerfile)"
      test -n "${FEDORA_VERSION}"
      echo "Building Fedora Silverblue ${FEDORA_VERSION} at ${CI_COMMIT_SHA}"

      # Always exist so artifacts: paths never matches nothing.
      : > image-digests.txt

      # podman build \
      #   --file Containerfile \
      #   --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
      #   --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
      #   --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
      #   --tag "${IMAGE_NAME}:latest" \
      #   --tag "${IMAGE_NAME}:${FEDORA_VERSION}" \
      #   --tag "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
      #   .

      buildah build \
        --log-level=info \
        --file Containerfile \
        --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --tag "${IMAGE_NAME}:latest" \
        --tag "${IMAGE_NAME}:${FEDORA_VERSION}" \
        --tag "${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}" \
        .
      echo "Build: done"

      # stdin keeps the token out of the process list.
      printf '%s' "${CI_REGISTRY_PASSWORD}" | buildah login \
        --username "${CI_REGISTRY_USER}" \
        --password-stdin \
        "${CI_REGISTRY}"
      echo "Logging in to registry: done"

      for TAG in "latest" "${FEDORA_VERSION}" "${CI_COMMIT_SHORT_SHA}"; do
        buildah tag "localhost/${IMAGE_NAME}:${TAG}" "${CI_REGISTRY_IMAGE}:${TAG}"
        buildah push --digestfile "/tmp/digest.${TAG}" "docker://${CI_REGISTRY_IMAGE}:${TAG}" 
        printf '%-12s %s\n' "${TAG}" "$(cat "/tmp/digest.${TAG}")" \
          | tee -a image-digests.txt
      done
      echo "Pushing images: done"
  after_script:
    - |
      # Free the tags; layer cache is kept so the next build stays warm.
      FEDORA_VERSION="$(sed -n 's/^ARG BASE_IMAGE_TAG="\([0-9]*\)"/\1/p' Containerfile)"
      for NAME in "localhost/${IMAGE_NAME}" "${CI_REGISTRY_IMAGE}"; do
        for TAG in "latest" "${FEDORA_VERSION}" "${CI_COMMIT_SHORT_SHA}"; do
          buildah rmi -f "${NAME}:${TAG}" >/dev/null 2>&1 || true
        done
      done
  artifacts:
    name: "image-digests-${CI_COMMIT_SHORT_SHA}"
    paths:
      - image-digests.txt
