stages:
  - build
  - publish

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1

build:
  stage: build
  tags:
    - tubs-kns
  interruptible: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - set -euo pipefail
    - echo "Pipeline source ${CI_PIPELINE_SOURCE}"
    - podman build --tag custom-silverblue:latest --file Containerfile .

publish:
  stage: publish
  tags:
    - tubs-kns
  interruptible: true
  needs:
    - job: build
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - set -euo pipefail
    - IMAGE_NAME=custom-silverblue
    - DEFAULT_TAG=latest
    - IMAGE_REGISTRY="$CI_REGISTRY"
    - podman login --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$IMAGE_REGISTRY"
    - podman tag localhost/custom-silverblue:latest "$IMAGE_REGISTRY/$CI_PROJECT_PATH:$DEFAULT_TAG"
    - podman push "$IMAGE_REGISTRY/$CI_PROJECT_PATH:$DEFAULT_TAG"
    - echo "Image in the CR."