# Builds the image and pushes it to GHCR (one image, tags: latest,
# <fedora version>, <YYYYMMDD>-<5-char sha>), then optionally builds the
# installation ISO. The build logic lives in ci/build-image.sh and
# ci/build-iso.sh, shared with .gitlab-ci.yml so both CI systems stay in sync.
#
# Trigger parity with .gitlab-ci.yml: default branch, ci/* branches, weekly
# schedule, and manual runs. RECHUNK and BUILD_ISO default to true, matching
# the GitLab variables; both can be overridden per run via workflow_dispatch.

name: build-image

on:
  push:
    branches:
      - main
      - 'ci/**'
  schedule:
    # Weekly, Tuesday morning UTC (Bluefin's stable release day)
    - cron: '17 3 * * 2'
  workflow_dispatch:
    inputs:
      rechunk:
        description: Re-split the image into content-based layers (chunkah)
        type: boolean
        default: true
      build_iso:
        description: Build the installation ISO
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: custom-silverblue
  IMAGE_REPO: ghcr.io/${{ github.repository }}
  SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
  # osbuild's bootc-image-builder, pinned by digest (same pin as .gitlab-ci.yml)
  BIB_IMAGE: quay.io/centos-bootc/bootc-image-builder@sha256:2b52843ea2bfda73b0a08d97e76b734393b1d3a804681b9fabb26723bd3a2f0b

jobs:
  image-build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      packages: write
    outputs:
      fedora_version: ${{ steps.build.outputs.fedora_version }}
      image_tag: ${{ steps.build.outputs.image_tag }}
      build_iso: ${{ steps.build.outputs.build_iso }}
    steps:
      - name: Checkout (with extension submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install podman and buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman buildah

      - name: Build and push image
        id: build
        env:
          INPUT_RECHUNK: ${{ inputs.rechunk }}
          INPUT_BUILD_ISO: ${{ inputs.build_iso }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export RECHUNK="${INPUT_RECHUNK:-true}"
          echo "build_iso=${INPUT_BUILD_ISO:-true}" >> "$GITHUB_OUTPUT"
          ci/build-image.sh

      - name: Upload image digests
        uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.txt

  iso-build:
    needs: image-build
    if: needs.image-build.outputs.build_iso == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          sudo apt-get clean
          df -h /

      - name: Install podman and buildah
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends podman buildah

      - name: Build and publish installation ISO
        env:
          IMAGE_TAG: ${{ needs.image-build.outputs.image_tag }}
          FEDORA_VERSION: ${{ needs.image-build.outputs.fedora_version }}
          ISO_UPLOAD: github
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: ci/build-iso.sh
